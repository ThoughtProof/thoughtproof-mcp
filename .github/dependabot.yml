version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Groups only filter which updates share a PR. They do not suppress
    # ungrouped updates — #22 left majors opening individually (#26
    # @types/node 26, #27 typescript 7, #28 zod 4). Ignore majors so
    # Dependabot does not recreate them.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      production-deps:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
      dev-deps:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
