# HOL AI Plugin Scanner — recommended for Awesome AI Plugins / hol.org listing hygiene.
# Catalog listing does not require a green scan; score ≠ next-action authorization.
# See: https://github.com/hashgraph-online/awesome-ai-plugins/blob/main/SCANNER_GUIDE.md
name: HOL Plugin Scanner

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # pin: hashgraph-online/ai-plugin-scanner-action@v1.2.620
      - uses: hashgraph-online/ai-plugin-scanner-action@f4dddb9f9956baaef49d53e962880807416596ef
        with:
          plugin_dir: "."
          mode: scan
          # Score already B (80+). Remaining "high" hits are false-positive
          # key-shape mentions in docs/tests (dqlk_/dqla_ prefixes), not live secrets.
          # Fail closed only on critical; score gate still enforced.
          min_score: 80
          fail_on_severity: critical
          pr_comment: off
